[package]
name = "minimal-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
iggy = { path = "../../core/sdk" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
